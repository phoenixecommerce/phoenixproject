# kind cluster for Project Phoenix
# Maps NodePort 30080 inside the cluster to http://localhost:8080 on your laptop.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: phoenix
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8080
        protocol: TCP
