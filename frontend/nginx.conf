server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Static frontend
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Forward API calls to the product-api Kubernetes Service.
    # "product-api" resolves through Kubernetes DNS inside the cluster.
    location /api/ {
        proxy_pass http://product-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
